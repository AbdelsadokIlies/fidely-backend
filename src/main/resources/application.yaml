spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: Fidely-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/fidely_DB
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            scripts:
              action: create
              create-target: create.sql

  flyway:
    enabled: true